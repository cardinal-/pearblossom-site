<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="./pearblossom favicon.png" />
  <title>Pearblossom</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #EAEAE5;
      color: #00092B;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .icon {
      width: 120px;
      height: 120px;
      border-radius: 8px;
      margin-bottom: 24px;
    
    }

    h1 {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    p {
      font-size: 18px;
      color: #51537F;
      margin-bottom: 48px;
    }

    .coming-soon {
      display: inline-block;
      background-color: #F8F8EF;
      color: #00092B;
      border: 1.5px solid #00092B;
      padding: 14px 32px;
      font-size: 16px;
      letter-spacing: 0.5px;
      box-shadow: 3px 3px 0px #51537F;
    }

    footer {
      position: fixed;
      bottom: 24px;
      font-size: 13px;
      color: #51537F;
    }

    footer a {
      color: #51537F;
      text-decoration: underline;
    }

    /* Full-bleed strip of recent @pearblossom.app posts, drifting slowly
       left-to-right on an infinite loop. Breaks out of the centered,
       padded body via the negative-margin 100vw trick so it can span the
       full viewport width regardless of how narrow the body's own content
       column is. */
    .ig-strip {
      width: 100vw;
      margin-left: calc(-50vw + 50%);
      margin-top: 56px;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
      mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
    }

    .ig-track {
      display: flex;
      width: max-content;
      gap: 12px;
      padding: 0 12px;
      animation: ig-scroll 30s linear infinite;
    }

    .ig-track img {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border: 1.5px solid #00092B;
      flex-shrink: 0;
    }

    @keyframes ig-scroll {
      from { transform: translateX(-50%); }
      to { transform: translateX(0); }
    }

    .ig-caption {
      margin-top: 16px;
      font-size: 13px;
    }

    .ig-caption a {
      color: #51537F;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <img class="icon" src="./pearblossom icon.png" alt="Pearblossom app icon" />
  <h1>Pearblossom</h1>
  <p>A new way to compose photos. Coming soon.</p>
  <div class="coming-soon">Available on the App Store</div>

  <div class="ig-strip">
    <div class="ig-track">
      <!-- Recent compositions from @pearblossom.app, oldest to newest.
           The full list is duplicated once immediately below so the
           `ig-scroll` keyframes (0% at -50%, 100% at 0) loop seamlessly —
           halfway through the animation the track is back to looking
           exactly like its start. Duplicate BOTH copies in lockstep
           whenever a post is added or removed, and keep them in the same
           order in each half.

           `loading="eager"` (not the default-ish "lazy") on every image
           here — the animation starts with the track shifted so the first
           (real) copy sits just off left of the viewport, and a lazy image
           only fetches once it's about to scroll into view. That made
           images visibly pop in one at a time as the loop first played,
           instead of all being ready before the animation starts. -->
      <img src="./instagram/ig-2026-07-14.jpg" alt="Pearblossom composition posted July 14, 2026" loading="eager" />
      <img src="./instagram/ig-2026-07-20.jpg" alt="Pearblossom composition posted July 20, 2026" loading="eager" />
      <img src="./instagram/ig-2026-07-23.jpg" alt="Pearblossom composition posted July 23, 2026" loading="eager" />
      <img src="./instagram/ig-2026-07-28.jpg" alt="Pearblossom composition posted July 28, 2026" loading="eager" />

      <img src="./instagram/ig-2026-07-14.jpg" alt="" aria-hidden="true" loading="eager" />
      <img src="./instagram/ig-2026-07-20.jpg" alt="" aria-hidden="true" loading="eager" />
      <img src="./instagram/ig-2026-07-23.jpg" alt="" aria-hidden="true" loading="eager" />
      <img src="./instagram/ig-2026-07-28.jpg" alt="" aria-hidden="true" loading="eager" />
    </div>
  </div>
  <p class="ig-caption"><a href="https://www.instagram.com/pearblossom.app/">Follow @pearblossom.app on Instagram</a></p>

  <footer>
    <a href="/pearblossom-site/privacy/">Privacy Policy</a>
  </footer>

</body>
</html>
